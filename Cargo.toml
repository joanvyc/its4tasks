[package]
name = "its4tasks"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
directories = "6.0.0"
eframe = "0.37.0"
sea-orm = { version = "2.0.4", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-chrono"] }
sea-orm-migration = { version = "2.0.4", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["macros", "net", "rt", "rt-multi-thread", "time"] }
ureq = { version = "3.4.2", features = ["json"] }
uuid = { version = "1.28.0", features = ["v4", "serde", "v7"] }

[dev-dependencies]
tempfile = "3.27.0"
