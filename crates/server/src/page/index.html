<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>its4tasks</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f4f4;
        --text: #1f1f1f;
        --weak: #5c5c5c;
        --button: #e4e4e4;
        --button-hover: #d8d8d8;
        --border: #cfcfcf;
        --error: #c8372d;
      }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      canvas { display: none; width: 100%; height: 100%; }
      body.app { overflow: hidden; }
      body.app canvas { display: block; }
      body.app #panel { display: none; }
      #panel {
        box-sizing: border-box;
        max-width: 460px;
        margin: 0 auto;
        padding: 22vh 16px 32px;
        text-align: center;
      }
      h1 { font-size: 1.5rem; margin: 0 0 8px; }
      p { margin: 0 0 22px; color: var(--weak); line-height: 1.45; }
      button {
        display: block;
        box-sizing: border-box;
        width: 100%;
        max-width: 260px;
        margin: 0 auto 10px;
        padding: 9px 12px;
        font: inherit;
        color: var(--text);
        background: var(--button);
        border: 1px solid var(--border);
        border-radius: 6px;
        cursor: pointer;
      }
      button.primary { font-weight: 600; }
      button:hover:not(:disabled) { background: var(--button-hover); }
      button:disabled { opacity: 0.55; cursor: default; }
      #error { color: var(--error); margin-top: 14px; min-height: 1.4em; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <!-- Blank until it's known what to show: nothing big downloads first. -->
    <div id="panel">
      <div id="landing" hidden>
        <h1>Welcome to its4tasks</h1>
        <p>Your board is empty. Start with a short tour, or bring your tasks along.</p>
        <button id="start" class="primary">Start a new board</button>
        <button id="import">Import a board.json…</button>
        <input id="file" type="file" accept=".json,application/json" hidden />
      </div>
      <div id="problem" hidden>
        <h1 id="problem-title"></h1>
        <p id="problem-text"></p>
        <button id="problem-action" class="primary"></button>
      </div>
      <div id="error" role="alert"></div>
    </div>
    <canvas id="its4tasks"></canvas>
    <script type="module">
      // Decides what to show before downloading the board app: sign-in for
      // someone signed out, the landing for a new user, else the app. With
      // Clerk, `its4tasksAuth` (added by the server) gives tokens; without
      // it, the session cookie signs requests in.
      const auth = window.its4tasksAuth;
      const $ = (id) => document.getElementById(id);

      class Refused extends Error {
        constructor(status, message) {
          super(message);
          this.status = status;
        }
      }

      // Never settles: the browser is on its way elsewhere.
      const leaving = () => new Promise(() => {});

      async function authorization() {
        if (!auth) return {};
        // A second, fresh try before sending anyone away: Clerk can briefly
        // have no token while it renews one.
        const token = (await auth.token()) || (await auth.token({ fresh: true }));
        if (!token) {
          await auth.signIn();
          return leaving();
        }
        return { Authorization: `Bearer ${token}` };
      }

      async function api(method, path, body) {
        const response = await fetch(path, {
          method,
          body,
          credentials: "same-origin",
          headers: await authorization(),
        });
        if (!response.ok) {
          const text = await response.text();
          throw new Refused(response.status, text || `The server answered ${response.status}.`);
        }
        return response.json();
      }

      function show(id) {
        for (const part of ["landing", "problem"]) $(part).hidden = part !== id;
      }

      function problem(e) {
        const signedOut = e instanceof Refused && e.status === 401;
        $("problem-title").textContent = signedOut ? "Signed out" : "Can't reach your board";
        $("problem-text").textContent = signedOut
          ? "Sign in again to see your board."
          : e.message || String(e);
        $("problem-action").textContent = signedOut ? "Sign in" : "Try again";
        $("problem-action").onclick = () =>
          signedOut && auth ? auth.signIn() : window.location.reload();
        $("error").textContent = "";
        show("problem");
      }

      async function loadApp() {
        document.body.classList.add("app");
        try {
          const { default: init } = await import("/its4tasks.js");
          await init({ module_or_path: "/its4tasks_bg.wasm" });
        } catch (e) {
          document.body.classList.remove("app");
          problem(new Error(`The app didn't load: ${e.message || e}`));
        }
      }

      function busy(on) {
        $("start").disabled = on;
        $("import").disabled = on;
      }

      async function act(request) {
        busy(true);
        $("error").textContent = "";
        try {
          await request();
          await loadApp();
        } catch (e) {
          if (e instanceof Refused && e.status === 401) return problem(e);
          // Started meanwhile, say in another tab.
          if (e instanceof Refused && e.status === 409) return loadApp();
          $("error").textContent = e.message || String(e);
          busy(false);
        }
      }

      $("start").onclick = () => act(() => api("POST", "/api/start"));
      $("import").onclick = () => $("file").click();
      $("file").onchange = () => {
        const file = $("file").files[0];
        $("file").value = "";
        if (file) act(async () => api("POST", "/api/import", await file.text()));
      };

      try {
        const view = await api("GET", "/api/board");
        if (view.started) await loadApp();
        else show("landing");
      } catch (e) {
        problem(e);
      }
    </script>
  </body>
</html>
