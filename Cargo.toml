[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
its4tasks-core = { path = "crates/core" }
its4tasks-server = { path = "crates/server" }
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
directories = "6.0.0"
eframe = "0.37.0"
ehttp = { version = "0.7.1", features = ["json"] }
ureq = { version = "3.4.2", features = ["json"] }
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
# The database backends are features of its4tasks-server (sqlite, postgres).
sea-orm = { version = "2.0.4", default-features = false, features = ["runtime-tokio-rustls", "macros", "with-chrono"] }
sea-orm-migration = { version = "2.0.4", default-features = false, features = ["runtime-tokio-rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tower = { version = "0.5.2", features = ["util"] }
tokio = { version = "1.54.0", features = ["macros", "net", "rt", "rt-multi-thread", "time"] }
uuid = { version = "1.28.0", features = ["v4", "v7", "serde"] }
wasm-bindgen-futures = "0.4.79"
web-sys = "0.3.106"
web-time = "1.1.0"
